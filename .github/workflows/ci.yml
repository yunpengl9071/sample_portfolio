name: CI

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]  # Focus on 3.11 for now

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock
        pip install black ruff mypy

    - name: Lint with ruff
      run: |
        ruff check trialsense/ --output-format=github || true
      continue-on-error: true

    - name: Format check with black
      run: |
        black --check trialsense/ tests/ || true
      continue-on-error: true

    - name: Type check with mypy
      run: |
        mypy trialsense/ --ignore-missing-imports || true
      continue-on-error: true

    - name: Test with pytest
      run: |
        pytest tests/unit/test_clinical_trials_client.py -v --cov=trialsense.data --cov-report=term-missing
      continue-on-error: false

    - name: Test agents (allow failures - requires API keys)
      run: |
        pytest tests/unit/test_agents.py -v || true
      continue-on-error: true

    - name: Test tools (allow failures - requires API keys)
      run: |
        pytest tests/unit/test_tools.py -v || true
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t trialsense-ai:latest .

    - name: Test Docker image can import package
      run: |
        docker run --rm trialsense-ai:latest python -c "import trialsense; print('TrialSense version:', trialsense.__version__)"
